<!doctype html>
<html lang="en-US">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Review / Contact — Zuma Rock</title>
  <meta name="description" content="Submit a short review or question about Zuma Rock — student project." />
  <link rel="stylesheet" href="styles/style.css">
  <script src="scripts/form.js" defer></script>
</head>
<body>
  <header class="site-header">
    <div class="wrap">
      <h1>Leave a Review / Contact</h1>
      <nav class="main-nav">
        <a href="index.html">Home</a>
        <a href="gallery.html">Gallery</a>
        <a href="form.html">Review / Contact</a>
        <a href="reference.html">References</a>
      </nav>
    </div>
  </header>

  <main class="wrap">
    <section class="card">
      <h2>Product / Visit Review</h2>

      <form id="reviewForm" method="get" action="references.html">
        <!-- Product select (dynamic example using array in form.js) -->
        <label for="product">Visited location</label>
        <select id="product" name="product" required>
          <option value="" disabled selected>Select a place...</option>
        </select>

        <!-- Overall rating (1-5) -->
        <fieldset>
          <legend>Overall rating (required)</legend>
          <label><input type="radio" name="rating" value="1" required> 1</label>
          <label><input type="radio" name="rating" value="2"> 2</label>
          <label><input type="radio" name="rating" value="3"> 3</label>
          <label><input type="radio" name="rating" value="4"> 4</label>
          <label><input type="radio" name="rating" value="5"> 5</label>
        </fieldset>

        <label for="visitDate">Date of visit</label>
        <input id="visitDate" name="visitDate" type="date" required>

        <label>Features you liked</label>
        <label><input type="checkbox" name="feature" value="View"> View</label>
        <label><input type="checkbox" name="feature" value="Photo spots"> Photo spots</label>
        <label><input type="checkbox" name="feature" value="Accessibility"> Accessibility</label>

        <label for="reviewText">Write a short review (optional)</label>
        <textarea id="reviewText" name="reviewText" rows="4"></textarea>

        <label for="visitorName">Your name (optional)</label>
        <input id="visitorName" name="visitorName" type="text">

        <div style="margin-top:10px;">
          <input type="submit" value="Submit review">
        </div>
      </form>

      <p class="muted">Total reviews submitted on this browser: <strong id="reviewCount">0</strong></p>
    </section>
  </main>

  <footer class="site-footer">
    <p>© <span id="yearForm"></span> Odukoya Olaleye Moses | Nigeria</p>
    <p>Last Modified: <span id="lastModifiedForm"></span></p>
  </footer>
</body>
</html>
